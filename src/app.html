<!doctype html>
<html lang="en">
	<head>
		<script>
			try {
				var themeKey = 'komatose.theme';
				var themeChoice = localStorage.getItem(themeKey) || 'system';
				if (themeChoice !== 'light' && themeChoice !== 'dark') themeChoice = 'system';
				var themeDark = themeChoice === 'dark' || (themeChoice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				var themeName = themeDark ? 'dark' : 'light';
				document.documentElement.dataset.theme = themeName;
				document.documentElement.dataset.bsTheme = themeName;
				document.documentElement.dataset.themeChoice = themeChoice;
			} catch (e) {}
		</script>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Cause:wght@100..900&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
